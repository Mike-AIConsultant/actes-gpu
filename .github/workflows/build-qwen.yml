name: build qwen image

# Separate from build.yml on purpose: this builds gpu/qwen/Dockerfile (the acta-writing LLM),
# never gpu/Dockerfile (the speech image). The two images do not share a trigger, so editing
# one can never accidentally rebuild the other.

on:
  push:
    branches: [main, qwen]
    paths:
      - "qwen/Dockerfile"
      - "qwen/handler.py"
      - ".github/workflows/build-qwen.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: "!contains(github.event.head_commit.message, '[no build]')"
    steps:
      - uses: actions/checkout@v4

      # main publishes :qwen-latest, which is what the live acta endpoint will pull once this
      # is proved out. Any other branch (e.g. qwen, while this is being built and tested)
      # publishes under its own tag so nothing touches :qwen-latest before it is ready.
      - name: choose tags
        id: tags
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tags=ghcr.io/mike-aiconsultant/actes-gpu:qwen-latest,ghcr.io/mike-aiconsultant/actes-gpu:qwen-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/mike-aiconsultant/actes-gpu:qwen-${GITHUB_REF_NAME}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      # The image is roughly 36 GB with the model baked in (base vLLM image + 19.45 GB of
      # weights). A stock runner does not have room on / unless the preinstalled toolchains are
      # removed first, same fix as build.yml.
      - name: free up disk
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY" \
                      /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true
          sudo apt-get clean
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker image prune -af || true
          df -h / /mnt

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: ./qwen
          file: ./qwen/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}

      - name: report image size
        run: |
          docker image ls ghcr.io/mike-aiconsultant/actes-gpu || true
          df -h /mnt
