name: build gpu image

on:
  push:
    branches: [main, model-shelf]
    # Only rebuild when something that ends up inside the image changes. The image takes
    # about twenty minutes to build and push, so a README or script edit must not trigger
    # it. Use "Run workflow" in the Actions tab to force a rebuild.
    paths:
      - "Dockerfile"
      - "handler.py"
      - "registry.py"
      - "convert.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # main publishes :latest, which is what the live endpoint pulls. Every other branch
      # publishes under its own tag, so a work-in-progress image can be built and tested
      # against a throwaway endpoint without touching what is serving meetings.
      - name: choose tags
        id: tags
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tags=ghcr.io/mike-aiconsultant/actes-gpu:latest,ghcr.io/mike-aiconsultant/actes-gpu:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/mike-aiconsultant/actes-gpu:${GITHUB_REF_NAME},ghcr.io/mike-aiconsultant/actes-gpu:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      # The image is ~19 GB with the models baked in. A stock runner does not have room on /
      # unless the preinstalled toolchains are removed first, and docker's own store is moved
      # to /mnt, which is the roomy disk on a GitHub runner.
      - name: free up disk
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY" \
                      /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true
          sudo apt-get clean
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker image prune -af || true
          df -h / /mnt

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}

      - name: report image size
        run: |
          docker image ls ghcr.io/mike-aiconsultant/actes-gpu || true
          df -h /mnt
