name: build gpu image

on:
  push:
    branches: [main, model-shelf]
    # Only rebuild when something that ends up inside the image changes. A 13.8 GB image
    # takes about twenty minutes to build and push, so a README or script edit must not
    # trigger it. Use "Run workflow" in the Actions tab to force a rebuild.
    paths:
      - "Dockerfile"
      - "handler.py"
      - "registry.py"
      - "convert.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The image is ~20 GB with the models baked in. A stock runner does not have room
      # unless the preinstalled toolchains are removed first.
      - name: free up disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY" \
                      /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true
          sudo apt-get clean
          docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          # A branch build gets its own tag, so :latest keeps serving the proven image
          # until the new one has been tested against a throwaway endpoint.
          tags: |
            ghcr.io/mike-aiconsultant/actes-gpu:${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
            ghcr.io/mike-aiconsultant/actes-gpu:${{ github.sha }}
